# nginx in the frontend image: serves the built app and forwards the API to the backend,
# so the browser sees a single origin (no CORS), as with the Vite dev server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Materials up to 20 MB (MAX_UPLOAD_MB), plus the multipart envelope.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # The built files have hashed names: cache them for long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Every other path is a page of the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
