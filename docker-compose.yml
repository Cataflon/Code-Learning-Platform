services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autograder
      POSTGRES_PASSWORD: autograder
      POSTGRES_DB: autograder
    ports:
      # Host port 5433: 5432 is often taken by a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autograder -d autograder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
